<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance — D On Net Co.,Ltd.</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="assets/style.css?v=f3">
<link rel="icon" type="image/webp" href="../shared/assets/d-on-net-logo.webp"><link rel="stylesheet" href="../shared/brand.css?v=20261101"><link rel="stylesheet" href="../shared/cyber.css?v=20261101"></head>
<body class="cyber-app">

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img class="don-brand-logo" src="../shared/assets/d-on-net-logo.webp" alt="D On Net Co.,Ltd." width="176" height="232"></div>
    <div class="login-title">Finance</div>
    <div class="login-sub">ควบคุมรายรับรายจ่าย · เบิกจ่ายผ่านการอนุมัติ</div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="msalLogin()">เข้าสู่ระบบด้วย Google</button>
    <div id="gbtn" style="margin-top:8px;display:flex;justify-content:center"></div>
  </div>
</div>

<div id="app-screen">
  <aside class="sidebar">
    <div class="brand"><span class="brand-ico"><img class="don-brand-logo" src="../shared/assets/d-on-net-logo.webp" alt="D On Net Co.,Ltd." width="176" height="232"></span> Finance</div>
    <nav>
      <div class="nav-item active" data-v="dash" onclick="go('dash')"><span class="ni-ico">📊</span><span class="ni-lb">ภาพรวม</span></div>
      <div class="nav-item" data-v="ledger" onclick="go('ledger')"><span class="ni-ico">📒</span><span class="ni-lb">รายการ</span></div>
      <div class="nav-item" data-v="req" onclick="go('req')"><span class="ni-ico">🧾</span><span class="ni-lb">ใบเบิก</span></div>
      <div class="nav-item" data-v="report" onclick="go('report')"><span class="ni-ico">📈</span><span class="ni-lb">รายงาน</span></div>
      <div class="nav-item" data-v="parties" onclick="go('parties')"><span class="ni-ico">🏢</span><span class="ni-lb">ผู้รับ / ผู้ขาย / ลูกค้า</span></div>
      <div class="nav-item" data-v="cat" onclick="go('cat')"><span class="ni-ico">🏷️</span><span class="ni-lb">หมวดหมู่</span></div>
    </nav>
    <div class="side-foot">
      <a href="../" class="back-portal">← กลับ Portal</a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div id="role-badge"></div>
      <div class="user">
        <span class="avatar" id="user-avatar">U</span>
        <span id="user-name" class="uname"></span>
        <button class="btn btn-sm" onclick="logout()">ออก</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
  <button id="fab" class="fab" onclick="openTx('expense')" title="บันทึกรายจ่าย">＋</button>
</div>

<div id="toasts"></div>

<script src="../shared/gateway-client.js?v=admin1"></script>
<script src="../shared/bank-details.js?v=bank1"></script>
<script src="js/config.js?v=admin1"></script>
<script src="js/api.js?v=admin1"></script>
<script src="js/auth.js?v=admin1"></script>
<script src="js/tax.js?v=bank1"></script>
<script src="js/app.js?v=bank1"></script>
</body>
</html>
