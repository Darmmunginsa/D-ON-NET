<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance — iT Services</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="assets/style.css?v=f1">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">💵</div>
    <div class="login-title">Finance</div>
    <div class="login-sub">ควบคุมรายรับรายจ่าย · เบิกจ่ายผ่านการอนุมัติ</div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="msalLogin()">เข้าสู่ระบบด้วย Google</button>
    <div id="gbtn" style="margin-top:8px;display:flex;justify-content:center"></div>
  </div>
</div>

<div id="app-screen">
  <aside class="sidebar">
    <div class="brand"><span class="brand-ico">💵</span> Finance</div>
    <nav>
      <div class="nav-item active" data-v="dash" onclick="go('dash')">📊 ภาพรวม</div>
      <div class="nav-item" data-v="ledger" onclick="go('ledger')">📒 รายการรับ-จ่าย</div>
      <div class="nav-item" data-v="req" onclick="go('req')">🧾 ใบขอเบิก</div>
      <div class="nav-item" data-v="report" onclick="go('report')">📈 รายงาน</div>
      <div class="nav-item" data-v="cat" onclick="go('cat')">🏷️ หมวดหมู่</div>
    </nav>
    <div class="side-foot">
      <a href="../" class="back-portal">← กลับ Portal</a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div id="role-badge"></div>
      <div class="user">
        <span class="avatar" id="user-avatar">U</span>
        <span id="user-name" class="uname"></span>
        <button class="btn btn-sm" onclick="logout()">ออก</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="toasts"></div>

<script src="js/config.js?v=f1"></script>
<script src="js/api.js?v=f1"></script>
<script src="js/auth.js?v=f1"></script>
<script src="js/app.js?v=f1"></script>
</body>
</html>
